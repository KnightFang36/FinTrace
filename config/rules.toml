# Demonstration thresholds only. Version and review before applying.
schema_version = "1"
policy_version = "demo-v1"

[execution]
# Snapshot evaluation is bounded; limits never silently sample transactions.
max_input_transactions = 250000
max_findings_per_rule = 10000
max_evidence_transactions = 10000
max_allocation_entries = 20000
exclude_self_transfers = true

[pass_through]
enabled = true
window_minutes = 60
minimum_incoming_count = 3
minimum_forwarded_ratio = "0.80"
allocation_method = "fifo_observed_inflows"
require_strict_time_order = true

[fan_in]
enabled = true
window_minutes = 60
minimum_distinct_senders = 8

[fan_out]
enabled = true
window_minutes = 60
minimum_distinct_recipients = 8

[burst]
enabled = true
window_minutes = 60
minimum_count = 20
history_days = 7
minimum_complete_history_days = 7
baseline_multiplier = "4.0"

[dormant_activation]
enabled = true
observed_inactivity_days = 7
active_window_minutes = 120
minimum_count = 10
require_complete_observation_interval = true

[repeated_splitting]
enabled = true
window_minutes = 60
minimum_related_payments = 5
# No legal/reporting threshold is inferred.

# Graph-derived rules report coverage from this file but read their thresholds from
# config/graph.toml. Only 'enabled' is accepted here; other keys are rejected.
[layering]
enabled = true

[circular_flow]
enabled = true

[coordinated_group]
enabled = true

[cash_out]
enabled = false
# Enable only after an explicit, verified payment-format/exit mapping exists.

[profile_mismatch]
enabled = false

[known_exposure]
enabled = false
# Requires dated independent reference intelligence, never benchmark labels.
